[package]
name = "serai-full-stack-tests"
version = "0.1.0"
description = "Tests for Serai's Full Stack"
license = "AGPL-3.0-only"
repository = "https://github.com/serai-dex/serai/tree/develop/tests/full-stack"
authors = ["Luke Parker <lukeparker5132@gmail.com>"]
keywords = []
edition = "2021"
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
hex = "0.4"

async-trait = { version = "0.1", default-features = false }

zeroize = { version = "1", default-features = false }
rand_core = { version = "0.6", default-features = false }

ciphersuite = { path = "../../crypto/ciphersuite", default-features = false, features = ["std"] }
ciphersuite-kp256 = { path = "../../crypto/ciphersuite/kp256", default-features = false, features = ["std"] }
curve25519-dalek = { version = "4", features = ["rand_core"] }
dalek-ff-group = { path = "../../crypto/dalek-ff-group", default-features = false, features = ["std"] }
embedwards25519 = { path = "../../crypto/embedwards25519" }
secq256k1 = { path = "../../crypto/secq256k1" }
musig = { path = "../../crypto/dkg/musig" }
frost = { package = "modular-frost", path = "../../crypto/frost", features = ["tests"] }
schnorrkel = { path = "../../crypto/schnorrkel", package = "frost-schnorrkel" }

bitcoin-serai = { path = "../../networks/bitcoin" }
monero-simple-request-rpc = { git = "https://github.com/monero-oxide/monero-oxide", rev = "c8be5d3d1287669946a83fbfcb296ce2a8852e47" }
monero-wallet = { git = "https://github.com/monero-oxide/monero-oxide", rev = "c8be5d3d1287669946a83fbfcb296ce2a8852e47" }

scale = { package = "parity-scale-codec", version = "3" }
serde = "1"
serde_json = "1"

# processor = { package = "serai-processor", path = "../../processor", features = ["bitcoin", "monero"] }

serai-client-serai = { path = "../../substrate/client/serai" }

sp-core = { git = "https://github.com/serai-dex/patch-polkadot-sdk" }
sp-application-crypto = { git = "https://github.com/serai-dex/patch-polkadot-sdk" }

bitvec = { version = "1", default-features = false, features = ["std"] }

tokio = { version = "1", features = ["time"] }

dockertest = "0.5"
serai-docker-tests = { path = "../docker" }
# serai-message-queue-tests = { path = "../../message-queue/tests" }
# serai-processor-tests = { path = "../processor" }
# serai-coordinator-tests = { path = "../coordinator" }
